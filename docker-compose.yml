services:

  # ─────────────────────────────────────────────────────────────────
  # ASP.NET Core 10 API
  # ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: fleetos_api

    restart: unless-stopped

    ports:
      - "${APP_PORT:-5000}:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENV:-Development}
      - ASPNETCORE_URLS=http://+:8080

      - ConnectionStrings__DefaultConnection=${DATABASE_URL}

      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER:-fleetos-api}
      - Jwt__Audience=${JWT_AUDIENCE:-fleetos-clients}
      - Jwt__AccessExpiryMinutes=${JWT_ACCESS_EXPIRY_MINUTES:-60}
      - Jwt__RefreshExpiryDays=${JWT_REFRESH_EXPIRY_DAYS:-30}

      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-redis:6379}
      - Redis__Password=${REDIS_PASSWORD}

      - Supabase__Url=${SUPABASE_URL}
      - Supabase__ServiceKey=${SUPABASE_SERVICE_KEY}
      - Supabase__StorageBucket=${SUPABASE_STORAGE_BUCKET:-fleetos}

      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}

      - Seed__SystemAdminEmail=${SEED_SYSTEM_ADMIN_EMAIL}
      - Seed__SystemAdminPassword=${SEED_SYSTEM_ADMIN_PASSWORD}
      - Seed__TenantName=${SEED_TENANT_NAME}
      - Seed__TenantAdminEmail=${SEED_TENANT_ADMIN_EMAIL}
      - Seed__TenantAdminPassword=${SEED_TENANT_ADMIN_PASSWORD}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - fleetos_network

    volumes:
      - api_logs:/app/logs

  # ─────────────────────────────────────────────────────────────────
  # React + Vite Frontend
  # ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
        - VITE_APP_NAME=${VITE_APP_NAME:-FleetOS}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}

    container_name: fleetos_frontend

    restart: unless-stopped

    networks:
      - fleetos_network

  # ─────────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine

    container_name: fleetos_redis

    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - fleetos_network

    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping" ]

      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Nginx
  # ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine

    container_name: fleetos_nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - api
      - frontend

    networks:
      - fleetos_network

networks:

  fleetos_network:
    driver: bridge

volumes:

  redis_data:
    driver: local

  api_logs:
    driver: local


