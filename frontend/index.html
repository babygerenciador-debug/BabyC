<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <title>Baby Turismo</title>
    <script>!function(){try{var e=localStorage.getItem('fleetos-theme');if(e){var t=JSON.parse(e);if(t.state&&t.state.mode){document.documentElement.setAttribute('data-theme',t.state.mode);document.documentElement.style.colorScheme=t.state.mode;return}}var n=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',n);document.documentElement.style.colorScheme=n}catch(e){}}()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
