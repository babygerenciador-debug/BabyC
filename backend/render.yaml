services:
  - type: web
    name: fleetos-api
    runtime: image
    repo: https://github.com/babygerenciador-debug/BabyC
    branch: master
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: fleetos-api
      - key: Jwt__Audience
        value: fleetos-clients
      - key: Jwt__AccessExpiryMinutes
        value: "60"
      - key: Jwt__RefreshExpiryDays
        value: "30"
      - key: Cors__AllowedOrigins
        value: https://baby-c.vercel.app
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceKey
        sync: false
      - key: Supabase__StorageBucket
        value: fleetos
    healthCheckPath: /health
    port: 8080
